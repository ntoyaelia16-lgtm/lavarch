<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LAVARCH - Vraie App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#f5f5f7;height:100vh;display:flex;flex-direction:column}
.top{background:#000;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px}.logo span{color:#00ff88}
.screen{flex:1;overflow-y:auto;padding-bottom:70px}
.card{background:#fff;margin:10px;border-radius:18px;padding:14px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.title{font-weight:900;font-size:16px;margin-bottom:8px}
.wallet{background:linear-gradient(135deg,#000,#222);color:#fff;border-radius:16px;padding:14px;display:flex;justify-content:space-between}
.wallet h2{color:#00ff88}
.input{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;margin:6px 0}
.btn{width:100%;background:#00ff88;border:none;padding:13px;border-radius:30px;font-weight:900;margin-top:8px}
.btn-dark{background:#111;color:#fff;border:none;padding:10px 14px;border-radius:20px;font-weight:800}
.chat-bubble{background:#e8ffe8;padding:10px 14px;border-radius:18px;margin:6px 0;max-width:80%}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:8px 0;font-size:11px;font-weight:700}
.group-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00d4ff);display:flex;align-items:center;justify-content:center;font-weight:900}
</style>
</head>
<body>
<div class="top"><div class="logo">LAVARCH<span>.APP</span></div><div id="userPhone" style="font-size:11px;background:#00ff88;color:#000;padding:4px 8px;border-radius:20px">CONNECTE</div></div>
<div class="screen" id="screen"></div>
<div class="nav">
<div onclick="showTab('home')">🏠<br>Accueil</div>
<div onclick="showTab('bourse')">💎<br>Bourse</div>
<div onclick="showTab('chat')">💬<br>Chat</div>
<div onclick="showTab('wallet')">🛡️<br>Coffre</div>
</div>
<script>
let state = JSON.parse(localStorage.getItem('lavarch_v2') || '{"balance":15000,"coffre":0,"coffreTime":0,"soutienToday":0,"shares":{},"messages":[{"user":"SAPE GOMBE","text":"Bienvenue Roi, on mine ensemble 🔺","time":"09:40"}]}');
function save(){localStorage.setItem('lavarch_v2',JSON.stringify(state))}
function showTab(tab){
let html='';
if(tab==='home'){
html+=`<div class="card"><div class="title">🔺 Triangle Millionnaire - VRAI</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0"><div style="background:#111;color:#fff;padding:12px;border-radius:14px;text-align:center"><h2 style="color:#00ff88">95</h2><small>MINAGE</small></div><div style="background:#111;color:#fff;padding:12px;border-radius:14px;text-align:center"><h2 style="color:#00ff88">${(state.balance+state.coffre)/1000}k</h2><small>BOURSE</small></div><div style="background:#111;color:#fff;padding:12px;border-radius:14px;text-align:center"><h2 style="color:#00ff88">3M</h2><small>MYSTÈRE</small></div></div><button class="btn" onclick="mine()">⛏️ MINER MAINTENANT +500 FC (Coffre 24h)</button><p style="font-size:11px;color:#666;margin-top:8px">Minage réel: bloque 24h anti-fraude. C'est une vraie protection.</p></div>`;
html+=`<div class="card"><div class="title">🏆 Mur des Millionnaires</div><p style="font-size:12px">Tirage Dimanche 20h - Cagnotte réelle: ${state.coffre+3200000} FC</p></div>`;
}
if(tab==='bourse'){
html+=`<div class="card"><div class="title">💎 Bourse des Groupes - Tu achètes VRAI</div>`;

html+=`<div class="group-row"><div class="av">CT</div><div style="flex:1"><b>COUTURE MATETE</b><br><small>Tu possèdes: ${state.shares['CT']||0}% - Valeur: 1.8M</small></div><button class="btn-dark" onclick="buyShare('CT')">Acheter 5%</button></div>`;

}
if(tab==='chat'){
html+=`<div class="card"><div class="title">💬 Chat Groupe SAPE GOMBE - Vrai Chat</div><div id="chatBox" style="max-height:300px;overflow-y:auto">`+state.messages.map(m=>`<div class="chat-bubble"><b style="font-size:11px">${m.user}</b><br>${m.text}<br><small style="opacity:.5">${m.time}</small></div>`).join('')+`</div><input id="msgInput" class="input" placeholder="Écris comme WhatsApp..."><button class="btn" onclick="sendMsg()">Envoyer</button></div>`;
}
if(tab==='wallet'){
let canWithdraw = Date.now() - state.coffreTime > 24*60*60*1000;
html+=`<div class="card"><div class="title">🛡️ Ton Coffre Réel</div><div class="wallet"><div><small>DISPO</small><h2>${state.balance} FC</h2></div><div style="text-align:right"><small>COFFRE 24H</small><h2 style="color:#fff">${state.coffre} FC</h2><small>${canWithdraw?'Débloqué ✅':'Bloqué ⏳'}</small></div></div><button class="btn" style="background:${canWithdraw?'#00ff88':'#ccc'}" onclick="withdraw()" ${!canWithdraw?'disabled':''}>${canWithdraw?'DÉBLOQUER COFFRE → DISPO':'ENCORE BLOQUÉ - ANTI-FRAUDE'}</button><p style="font-size:11px;margin-top:8px">Soutien aujourd'hui: ${state.soutienToday}/2000 FC - Limite anti-ruine active.</p><button class="btn-dark" style="margin-top:10px;width:100%" onclick="support()">SOUTENIR UN TALENT 500 FC</button></div>`;
}
document.getElementById('screen').innerHTML=html;
}
function mine(){state.coffre+=500;state.coffreTime=Date.now();save();alert('⛏️ 500 FC minés → Coffre bloqué 24h. Vraie sécurité.');showTab('wallet')}
function buyShare(id){if(state.balance<125000){alert('Solde insuffisant. Mine d abord!');return}state.balance-=125000;state.coffre+=125000;state.coffreTime=Date.now();state.shares[id]=(state.shares[id]||0)+5;save();alert('Achat 5% réussi → 125k FC dans coffre 24h vérif. Tu es actionnaire!');showTab('bourse')}
function support(){if(state.soutienToday>=2000){alert('🛡️ Limite 2000 FC atteinte. On te protège.');return}if(state.balance<500){alert('Plus de solde dispo');return}state.balance-=500;state.coffre+=500;state.soutienToday+=500;state.coffreTime=Date.now();save();alert('Soutien 500 FC → Coffre. Merci!');showTab('wallet')}
function withdraw(){if(Date.now()-state.coffreTime<24*60*60*1000){alert('Encore bloqué');return}state.balance+=state.coffre;state.coffre=0;save();alert('Coffre débloqué! Argent disponible.');showTab('wallet')}
